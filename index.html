<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Cybershop Gestor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body>
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p>Cargando Gestor...</p>
    </div>
    
    <iframe id="app-frame" title="Cybershop Gestor" frameborder="0" allowfullscreen></iframe>

    <script src="config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const frame = document.getElementById('app-frame');
            const loader = document.getElementById('loader');
            
            // Set the iframe source to the Google Apps Script Web App URL
            frame.src = CONFIG.APPS_SCRIPT_URL;
            
            // Hide loader when iframe finishes loading
            frame.addEventListener('load', () => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            });
            
            // Fallback in case load event fails
            setTimeout(() => {
                if (loader.style.display !== 'none') {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
            }, 5000);
        });
    </script>
</body>
</html>
